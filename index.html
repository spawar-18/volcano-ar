<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Volcano Explorer</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌋 AR Volcano Explorer</h1>
        <p>Explore, learn and discover how volcanoes erupt in 3D & Augmented Reality.</p>
    </header>

    <main class="main-container">
        
        <div class="viewer-wrapper">
            <model-viewer id="volcano-viewer" src="volcano_model.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1" auto-rotate
                alt="Interactive 3D Volcano">

                <button slot="ar-button" class="ar-button">
                    📱 View Volcano in AR
                </button>

                <!-- Dedicated WebXR AR Overlay Slot Mount Point -->
                <div slot="ar-overlay" id="ar-slot-mount"></div>

            </model-viewer>
        </div>

        <!-- WebXR & 2D Overlay UI HUD Container -->
        <div id="ar-overlay-container" class="ar-overlay-container mode-2d">

            <!-- AR HUD Top Navigation Bar -->
            <div class="ar-hud-nav">
                <button id="nav-controls-btn" class="nav-tab active" onclick="switchTab('controls')">🌋 Explorer</button>
                <button id="nav-quiz-btn" class="nav-tab" onclick="switchTab('quiz')">🧠 Quiz</button>
                <button id="nav-toggle-btn" class="hud-toggle-btn" onclick="toggleHudVisibility()" title="Toggle UI Visibility">👁️ HUD</button>
            </div>

            <!-- Explorer Card -->
            <section id="tab-controls" class="hud-card active">
                <div class="hud-card-header">
                    <h2>🔎 Explore Volcano Features</h2>
                </div>

                <div class="button-grid">
                    <button class="feature-btn" onclick="showInfo('crater')">🕳️ Crater</button>
                    <button class="feature-btn" onclick="showInfo('magma')">🔥 Magma</button>
                    <button class="feature-btn" onclick="showInfo('lava')">🌋 Lava</button>
                    <button class="feature-btn" onclick="showInfo('ash')">💨 Ash & Gas</button>
                </div>

                <button class="eruption-btn" onclick="erupt()">💥 START ERUPTION</button>

                <div id="info" class="info-box">
                    👆 Tap any volcano feature above to inspect details!
                </div>
            </section>

            <!-- Quiz Card -->
            <section id="tab-quiz" class="hud-card">
                <div class="hud-card-header">
                    <h2>🧠 Volcano Quiz</h2>
                    <span id="quiz-progress" class="quiz-badge">Q 1/4</span>
                </div>

                <p id="question" class="quiz-question">Loading question...</p>

                <div id="quiz-options" class="quiz-options-grid">
                    <!-- Options generated dynamically -->
                </div>

                <div id="quiz-feedback" class="quiz-feedback hidden"></div>

                <div class="quiz-footer">
                    <span id="quiz-score-display">Score: 0</span>
                    <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Next Question ➔</button>
                </div>
            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
