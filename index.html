<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR Volcano Explorer</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AR CAMERA + 3D SCENE -->
    <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; facingMode: environment;">

        <!-- Camera -->
        <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false">
        </a-camera>

        <!-- Hiro marker with smoothing -->
        <a-marker id="hiro-marker" preset="hiro" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

            <!-- existing volcano model -->
            <a-entity id="volcano-model" gltf-model="volcano_model.glb" position="0 0 0" rotation="0 0 0"
                scale="0.5 0.5 0.5">
            </a-entity>
        </a-marker>
    </a-scene>


    <!-- ========================= -->
    <!-- EDUCATIONAL UI OVERLAY    -->
    <!-- ========================= -->

    <div id="ar-ui">

        <header>
            <h1>🌋 AR Volcano Explorer</h1>
            <p id="marker-status">🔍 Point your camera at the Hiro marker to scan</p>
        </header>

        <!-- Guide prompt shown before marker is scanned -->
        <div id="scan-prompt" class="scan-prompt">
            <div class="scan-card">
                <div class="scan-icon">🎯</div>
                <h2>Marker Required</h2>
                <p>Scan the <strong>Hiro marker</strong> with your camera to view the 3D Volcano.</p>
            </div>
        </div>

        <!-- Container shown ONLY when Hiro marker is detected -->
        <div id="marker-detected-container" class="marker-detected-container hidden">

            <!-- "Explore More" floating button shown first -->
            <div id="explore-bar" class="explore-bar">
                <button id="explore-btn" class="btn-explore" onclick="toggleExplore(true)">
                    <span>✨ Explore More (Facts & Quiz)</span>
                    <span class="btn-icon">⬇</span>
                </button>
            </div>

            <!-- Detailed info panel: hidden until 'Explore More' is clicked -->
            <div id="volcano-data" class="volcano-data hidden">

                <div class="sheet-top-bar">
                    <span class="sheet-title">🌋 Facts & Quiz</span>
                    <button class="btn-sheet-close" onclick="toggleExplore(false)" aria-label="Close details">✕ Close</button>
                </div>

                <section class="controls">

                    <h2>🔎 Explore Volcano Parts</h2>

                    <div class="button-grid">

                        <button onclick="showInfo('crater')">
                            🕳️ Crater
                        </button>

                        <button onclick="showInfo('magma')">
                            🔥 Magma
                        </button>

                        <button onclick="showInfo('lava')">
                            🌋 Lava
                        </button>

                        <button onclick="showInfo('ash')">
                            💨 Ash & Gas
                        </button>

                    </div>

                    <button class="eruption" onclick="erupt()">
                        🌋 START ERUPTION
                    </button>

                    <div id="info">
                        👆 Tap a volcano part above to learn about it.
                    </div>

                </section>


                <!-- QUIZ -->

                <section class="quiz">

                    <h2>🧠 Quick Volcano Quiz</h2>

                    <p id="question">
                        What is magma?
                    </p>

                    <button onclick="answer(false)">
                        A. Volcanic ash
                    </button>

                    <button onclick="answer(true)">
                        B. Molten rock beneath Earth's surface
                    </button>

                    <button onclick="answer(false)">
                        C. Hardened lava
                    </button>

                    <p id="quiz-result"></p>

                </section>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
